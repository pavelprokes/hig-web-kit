name: Release to npm
# Push a tag like v0.3.0 (matching package.json) to publish. Needs the NPM_TOKEN repository secret
# (npmjs.com → Access Tokens → Granular, "Read and write" for hig-web-kit). Publishes with provenance.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require(\"./package.json\").version')" = "${GITHUB_REF_NAME}"
      - run: npm run verify
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
